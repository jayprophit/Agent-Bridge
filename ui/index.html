<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetherius Supervisor Dashboard</title>
<script type="importmap">
{"imports": {"three": "./vendor/three.module.js"}}
</script>
<style>
  :root {
    --panel-w: 340px; --roster-w: 264px;
    --bg: #0e1014; --panel: #151922; --panel2: #1a2029; --line: #262d3a;
    --text: #d7dde9; --dim: #7f8a9e; --accent: #8b5cf6;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  #brand { font-weight: 600; }
  #brand b { color: var(--accent); }
  #viewbar { display: flex; gap: 4px; margin-left: 8px; }
  #statusbar { margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--dim); }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 11px; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.err { color: var(--err); border-color: var(--err); }
  #app { flex: 1; display: flex; min-height: 0; }
  #roster { width: var(--roster-w); display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line); }
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #agentpanel { width: var(--panel-w); display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line); }
  body.dock-left #agentpanel { order: -1; border-left: none; border-right: 1px solid var(--line); }
  h3 { margin: 0; padding: 8px 10px 4px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); }
  #roster-list { flex: 1; overflow: auto; padding: 0 8px 8px; }
  .agent { display: flex; gap: 8px; padding: 7px 8px; border: 1px solid transparent;
    border-radius: 8px; cursor: pointer; }
  .agent:hover { background: var(--panel2); }
  .agent.sel { border-color: var(--accent); background: var(--panel2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.run { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.warn { background: var(--warn); }
  .dot.err { background: var(--err); }
  .agent .meta { min-width: 0; }
  .agent .name { font-weight: 600; font-size: 12.5px; }
  .agent .sub { color: var(--dim); font-size: 11.5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #feed { flex: 1; overflow: auto; padding: 0 10px 10px; font-size: 11.5px;
    color: var(--dim); border-top: 1px solid var(--line); }
  .feedline { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .center-view { flex: 1; overflow: auto; padding: 14px 18px; }
  .hidden { display: none !important; }
  #transcript div { margin: 4px 0; }
  .who { color: var(--accent); font-weight: 600; }
  .tstamp { color: var(--dim); font-size: 11px; margin-left: 6px; }
  #team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .wcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .wcard h4 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 1.5px 0; }
  .kv span:first-child { color: var(--dim); flex: none; }
  .kv span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; }
  table.mono { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0; }
  table.mono td { padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.mono td:first-child { color: var(--dim); white-space: nowrap; }
  details { margin: 6px 0; }
  summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
  pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; overflow: auto; font-size: 11px; max-height: 320px; }
  #avatar { padding: 10px; text-align: center; border-bottom: 1px solid var(--line); }
  #face-wrap { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #0b0d11; }
  #face-wrap img { width: 100%; display: block; }
  body.compact #face-wrap img { max-height: 110px; object-fit: cover; }
  #face-ring { position: absolute; inset: 0; border-radius: 12px; border: 2px solid transparent; pointer-events: none; }
  #face-wrap[data-state="THINKING"] #face-ring,
  #face-wrap[data-state="WORKING"] #face-ring { border-color: var(--accent); animation: pulse 1.6s infinite; }
  #face-wrap[data-state="LISTENING"] #face-ring { border-color: var(--ok); animation: pulse 1.1s infinite; }
  #face-wrap[data-state="SPEAKING"] #face-ring { border-color: var(--ok); }
  #face-wrap[data-state="ERROR"] #face-ring { border-color: var(--err); }
  #face-wrap[data-state="APPROVAL"] #face-ring { border-color: var(--warn); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  #speak-bars { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    display: none; gap: 3px; align-items: flex-end; height: 18px; }
  #face-wrap[data-state="SPEAKING"] #speak-bars { display: flex; }
  #speak-bars i { width: 4px; background: var(--ok); border-radius: 2px; animation: bar .7s infinite ease-in-out; }
  #speak-bars i:nth-child(1) { height: 7px; animation-delay: 0s; }
  #speak-bars i:nth-child(2) { height: 13px; animation-delay: .12s; }
  #speak-bars i:nth-child(3) { height: 18px; animation-delay: .24s; }
  #speak-bars i:nth-child(4) { height: 12px; animation-delay: .36s; }
  #speak-bars i:nth-child(5) { height: 8px; animation-delay: .48s; }
  @keyframes bar { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
  #avatar-state { margin-top: 6px; font-size: 12px; color: var(--accent);
    font-weight: 600; letter-spacing: .06em; }
  #voice-line { font-size: 11px; color: var(--dim); margin-top: 2px; }
  #avatar-tools { display: flex; justify-content: flex-end; margin-top: 6px; }
  #tools, #approvals, #artifacts { border-top: 1px solid var(--line); padding: 7px 10px;
    font-size: 11.5px; color: var(--dim); max-height: 110px; overflow: auto; }
  #inputrow { display: flex; gap: 6px; border-top: 1px solid var(--line); padding: 8px; }
  #text-input { flex: 1; min-width: 0; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  #text-input:focus { outline: none; border-color: var(--accent); }
  #btn-mic { user-select: none; }
  #btn-mic.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .empty { color: var(--dim); padding: 8px 2px; font-size: 12px; }
  .held { color: var(--warn); }
</style>
</head>
<body data-view="chat" data-dock="right">
  <header id="topbar">
    <div id="brand">Aetherius <b>Supervisor</b></div>
    <nav id="viewbar">
      <button data-view="chat" class="on">Chat</button>
      <button data-view="work">Work</button>
      <button data-view="team">Team</button>
      <button data-view="monitor">Monitor</button>
    </nav>
    <div id="statusbar">
      <span id="sup-badge" class="badge">SUP: —</span>
      <span id="bridge-badge" class="badge">BRIDGE: —</span>
      <span>session <b id="session-id">…</b></span>
      <button id="btn-tts">TTS off</button>
      <button id="btn-call">Call</button>
      <button id="btn-dock">Dock: right</button>
      <button id="btn-compact">Compact</button>
    </div>
  </header>
  <div id="app">
    <aside id="roster">
      <h3>Agents <span id="roster-count"></span></h3>
      <div id="roster-list"><div class="empty">waiting for supervisor state…</div></div>
      <h3>Inter-agent feed</h3>
      <div id="feed"><div class="feedline">no events yet</div></div>
    </aside>
    <main id="center">
      <section id="chatview" class="center-view">
        <div id="transcript"></div>
        <div id="typing" class="empty hidden">supervisor is working…</div>
      </section>
      <section id="workview" class="center-view hidden">
        <div id="workspace" class="empty">workspace / editor / preview / terminal appear here</div>
        <div id="plan"></div>
      </section>
      <section id="teamview" class="center-view hidden">
        <div id="team-grid"><div class="empty">no workers in supervisor state</div></div>
      </section>
      <section id="monitorview" class="center-view hidden">
        <div id="monitor"></div>
      </section>
    </main>
    <aside id="agentpanel">
      <div id="avatar">
        <div id="face-wrap" data-state="IDLE">
          <img id="face-img" src="assets/face-neutral.webp" alt="avatar">
          <div id="face-ring"></div>
          <div id="speak-bars"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <canvas id="avatar-canvas" width="300" height="180" class="hidden"></canvas>
        <div id="avatar-tools">
          <button id="btn-3d" title="toggle 3D avatar (GLB, jaw/gaze lip-sync)">3D</button>
        </div>
        <div id="avatar-state">IDLE</div>
        <div id="voice-line">voice: —</div>
      </div>
      <div id="tools">tools: idle</div>
      <div id="approvals">approvals: none</div>
      <div id="artifacts">artifacts: none</div>
      <div id="inputrow">
        <button id="btn-mic" title="hold to talk (or hold Space)">MIC</button>
        <input id="text-input" placeholder="Type, or hold MIC / Space to talk…" autocomplete="off">
        <button id="btn-send">Send</button>
      </div>
    </aside>
  </div>
<script src="avatar.js"></script>
<script src="app.js"></script>
</body>
</html>
