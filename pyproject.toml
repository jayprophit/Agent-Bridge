[project]
name = "agent-bridge"
version = "0.8.1"
description = "Local-first bridge connecting small AI models, tools and devices through a unified runtime"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary — no open-source license granted (owner decision pending)" }
dependencies = []

[project.optional-dependencies]
telemetry = ["psutil==7.2.2"]
yaml = ["pyyaml>=6"]
# The benchmark harness genuinely REQUIRES psutil for its measurements, unlike
# the rest of the codebase where psutil is imported defensively and degrades to
# os.cpu_count(). Declared explicitly so that requirement is visible instead of
# being an undeclared hard import in benchmarks/benchmark_runner.py.
benchmark = ["psutil==7.2.2"]
# The declared test command runs seven test modules that import pytest, so
# pytest is a dependency of the test command and not an optional extra. It
# was undeclared, and a runner that installed only psutil could not import
# those seven modules at all, which is what the CI reported as failures.
test = ["pytest>=8"]

[tool.agent-bridge]
test_command = "python -m unittest discover -s tests -p test_*.py"
api_version = "v1"
protocol_version = "0.4"

[tool.pytest.ini_options]
# Markers for this suite.
#
# `slow` exists because one test class - the mutation proof in
# tests/test_actions_intake_mutations.py - is legitimately long rather than
# broken. It copies the repository 23 times and runs 6 test files per copy
# (~85s each), so it takes roughly 35-40 minutes on this host.
#
# Before this section existed the class was unmarked, so an ordinary
# `pytest tests` appeared to hang: output stopped at ~3% for tens of minutes
# with idle CPU. It was never deadlocked - it was inside that test. Marking it
# makes the cost visible instead of looking like a fault.
#
# Fast path (seconds to a couple of minutes, what to use while iterating):
#     python -m pytest tests -m "not slow"
# Full gate (includes mutation proof, ~40 min):
#     python -m pytest tests
markers = [
    "slow: long-running verification (mutation proof); deselect with -m 'not slow'",
]
