[project]
name = "agent-bridge"
version = "0.8.1"
description = "Local-first bridge connecting small AI models, tools and devices through a unified runtime"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary — no open-source license granted (owner decision pending)" }
dependencies = []

[project.optional-dependencies]
telemetry = ["psutil==7.2.2"]
yaml = ["pyyaml>=6"]
# The benchmark harness genuinely REQUIRES psutil for its measurements, unlike
# the rest of the codebase where psutil is imported defensively and degrades to
# os.cpu_count(). Declared explicitly so that requirement is visible instead of
# being an undeclared hard import in benchmarks/benchmark_runner.py.
benchmark = ["psutil==7.2.2"]
# The declared test command runs seven test modules that import pytest, so
# pytest is a dependency of the test command and not an optional extra. It
# was undeclared, and a runner that installed only psutil could not import
# those seven modules at all, which is what the CI reported as failures.
test = ["pytest>=8"]

[tool.agent-bridge]
test_command = "python -m unittest discover -s tests -p test_*.py"
api_version = "v1"
protocol_version = "0.4"

[tool.pytest.ini_options]
# Markers for this suite.
#
# `slow` marks verification that is real but cannot be a repository gate: it
# runs for minutes, or it depends on this workstation's installed applications
# and devices. The fast path is what a change must pass before it is offered;
# the slow path is scheduled and recorded separately.
#
# The original case was the mutation proof in
# tests/test_actions_intake_mutations.py: it copies the repository 23 times and
# runs 6 test files per copy (~85s each), so it takes roughly 35-40 minutes on
# this host. Before the marker existed, an ordinary `pytest tests` appeared to
# hang at ~3% with idle CPU; it was inside that test, not deadlocked.
#
# On 2026-10-25 the same disposition was applied to every module that launches
# a desktop application (Blender, FreeCAD, CuraEngine, OpenModelica), a real
# browser (browser_cdp, desktop E2E, UI acceptance), a hardware probe through
# PowerShell/WMI (device_runtime's forced refreshes), or a live Ollama
# inference. Those are environment proofs; they stay runnable and are excluded
# from the fast gate.
#
# Fast path (the repository gate):
#     python -m pytest tests -m "not slow"
# Full gate (includes external applications and the mutation proof):
#     python -m pytest tests
# Live model inference is separately opt-in:
#     $env:AETHERIUS_LIVE_OLLAMA = "1"; python -m pytest tests -m slow
# The live classes in test_local_team_execution.py and
# test_model_lifecycle_leases.py require that variable as well as the marker:
# without it they skip before any weights are loaded.
markers = [
    "slow: long-running or external-application verification; deselect with -m 'not slow'",
]
