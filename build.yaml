    status: ACCEPTED
    todo_ref: TODO-AB-005

notes:
  - >-
    The runtime itself is dependency-free by design. psutil and PyYAML are
    optional capabilities, and the benchmark harness genuinely requires
    psutil. requirements-lock.txt records the exact versions the tree was
    verified against.
  - >-
    This repository and its three sibling variants
    (Agent-Bridge-cloudhybrid, Agent-Bridge-dashboard,
    Agent-Bridge-runtimesafety) are the same codebase at v0.8.1 on different
    branches. They are tracked as separate projects because their scopes
    have diverged, but a fix here may need porting to the others.
  - >-
    Genesis proposes, P25 authorizes, Agent Bridge executes. The bridge must
    never perform the authorization step itself.
