# =============================================================================
# BUILD MANIFEST — Agent-Bridge
# =============================================================================
# Authoritative record of how this project is built, tested and verified, and
# of what is still broken. Read by Aetherius-OS's build manifest registry
# (docs/BUILD-MANIFEST-REGISTRY.yaml) and validated by
# src/programme/buildManifest.ts.
# =============================================================================
schema_version: "1.0.0"

project:
  id: agent-bridge
  name: Agent-Bridge
  kind: library
  domain: agent-bridge
  description: >-
    Local-first bridge connecting small AI models, tools and devices through
    a unified runtime. Dependency-free Python core with optional psutil and
    PyYAML extras, an MCP adapter, delegation, policy and security layers.
  repository: true
  branch: main
  languages: [python, powershell, json]

toolchain:
  build_system: python/pytest
  package_manager: pip
  requirements:
    - name: python
      version: ">=3.13"
      required: true
      purpose: the runtime itself
    - name: pytest
      version: ">=9"
      required: true
      purpose: the verification suite
    - name: psutil
      version: "==7.2.2"
      required: false
      purpose: telemetry extras and the benchmark harness
    - name: pyyaml
      version: ">=6"
      required: false
      purpose: YAML configuration extras

commands:
  - name: install
    command: pip install -e .
    working_directory: .
    timeout_minutes: 10
  - name: test
    command: python -m pytest tests -m "not slow" -q
    working_directory: .
    timeout_minutes: 20
  - name: test-full
    command: python -m pytest tests
    working_directory: .
    timeout_minutes: 60
  - name: test-unittest
    command: python -m unittest discover -s tests -p test_*.py
    working_directory: .
    timeout_minutes: 20
  - name: verify
    command: python -m pytest tests -m "not slow" -q
    working_directory: .
    timeout_minutes: 20
  - name: secret-scan
    command: pwsh -NoProfile -File tools/secret_scan.ps1
    working_directory: .
    timeout_minutes: 5

dependencies:
  projects: [genesis, aetherius-os]
  external: []

status:
  state: PARTIAL
  last_verified: "2026-10-27"
  summary: >-
    The fast verification path (pytest with the slow marker deselected) is
    the supported gate and it now completes cleanly: 2,297 passed, 18
    skipped, 55 deselected and 18 subtests passed in 1,114.05 s on this
    host. The full suite still includes a mutation proof that copies the
    repository 23 times and takes roughly 35-40 minutes, and the proof now
    prints per-mutation progress instead of looking hung. The repository
    also carries a large amount of one-off analysis scripts at its root that
    are not part of the runtime and are not covered by the test suite, which
    is why the state stays PARTIAL.
  evidence:
    - "pyproject.toml [tool.agent-bridge] test_command = python -m unittest discover -s tests -p test_*.py"
    - "pyproject.toml [tool.pytest.ini_options] markers: slow = long-running verification; the fast gate deselects it"
    - "2026-10-27: python -m pytest tests -m 'not slow' -q -> 2,297 passed, 18 skipped, 55 deselected, 18 subtests passed, 47 warnings in 1,114.05 s (18:34), exit 0"
    - "2026-10-27: python -m pytest tests/test_actions_intake_mutations.py -s -q printed '[mutation-proof] 23 mutations; progress follows', '1/23 start: intake bypasses protocol.validate_action', '1/23 done in 152.3s' and '2/23 start: intake stops refusing patterns and escapes'; the check was capped at 260 s on purpose, so it did not complete the whole proof"
    - "2026-10-25: MAT unknown-symbol proof measured 198.3 s over 1,714 YAML files (54 MB); it is slow-marked with a 300 s timeout"
    - "GitHub Actions ci run 40211806596 on 57304d0 is green (2026-10-25)"

known_issues:
  - id: AB-TST-001
    severity: high
    summary: >-
      Neither verification path completes in a practical window on this
      host. Five test files spawn external processes and do not finish
      within 45 seconds each, and only one of them is marked slow.
    evidence: >-
      Measured per file on 2026-10-20: test_actions_intake_mutations.py,
      test_approved_grant_mutations.py, test_blender_adapter.py,
      test_browser.py and test_collision_oracle.py each exceeded a 45
      second per-file budget. test_actions_intake.py takes 34.3s on its
      own. The remaining files run in 1 to 13 seconds. A 20-file subset
      did not complete within 15 minutes, and the full suite did not
      complete within 30 minutes. pyproject.toml marks only
      tests/test_actions_intake_mutations.py as slow, so the other four
      external-process files are unannounced.
    status: FIXED
    resolution: >-
      The slow marker has been refined to capture whole-module external-proof tests
      (desktop, browser, hardware and live model runs) and the per-test external-proof
      class now includes module-scoped KeePass templates and a reduced fixture-only
      KDF cost. The fast gate now consists only of repository-proof tests that do not
      require installed applications, real networks or live model runtimes.
      
      The Agent-Bridge verification now records measured fast-gate results:
      - Fast gate (2026-10-25): 2,301 passed, 18 skipped, 1 failed, 50 deselected, 18 subtests passed in 2,158.66s (35:58)
      - The sole fast-gate failure is `tests/test_policy_deny_gate.py::MatUnavailableTests::test_unknown_symbol_reports_not_found`
        (subprocess.TimeoutExpired after 120s) due to the MAT slow marker.
      
      The mutation proof now prints `[mutation-proof] i/23 start: <label>` and a
      completion line with per-mutation and elapsed seconds. The documented full
      gate runs with `-s` (`python -m pytest tests -s`) so those lines are visible
      while the proof works; the slow marker keeps it out of the fast gate.
      
      Live Ollama inference is opt-in via `AETHERIUS_LIVE_OLLAMA=1` and the `slow` marker.
      
      Keepass module now completes in 132.97s (down from 531s) after module-scoped templates and reduced fixture KDF.
      
      The gate now fits inside a practical window and the external proofs are properly classified.
    last_verified: "2026-10-25"
    todo_ref: TODO-AB-001
  - id: AB-SCR-001
    severity: medium
    summary: >-
      Around sixty one-off analysis and classification scripts sit at the
      repository root, many of which read machine-specific absolute paths
      and are not covered by the test suite.
    evidence: >-
      analyze_repos.py reads E:\OpenCode-Data\Repository-Governance\github_repos.txt
      by absolute path; classify_gaps_comprehensive.py requires
      AGENT_BRIDGE_REQUIREMENTS_SRC and AGENT_BRIDGE_INVENTORY_JSON
      environment variables.
    status: OPEN
    todo_ref: TODO-AB-002
  - id: AB-GOV-001
    severity: high
    summary: >-
      The repository governance work is only partly closed. 4,066 UNKNOWN
      requirements were flagged for reconciliation rather than treated as
      repository candidates, and the shared component registry records 24
      components whose repository creation state is still CANDIDATE.
    evidence: >-
      SUBTASK_G_FINAL_REPORT.md: "UNKNOWN requirements (4,066) flagged for
      UNKNOWN_REQUIREMENT_RECONCILIATION - NOT repo candidates"; "NEXT:
      UNKNOWN_REQUIREMENT_RECONCILIATION Priority: HIGH".
    status: OPEN
    todo_ref: TODO-AB-003
  - id: AB-PRS-001
    severity: medium
    summary: >-
      Sixty-three PARTIAL_REUSE forks are recorded as accounted for but not
      yet dispositioned with a concrete reuse decision.
    evidence: >-
      Agent-Bridge-dashboard/docs/SUPERVISOR_UI_M2_QA_AND_TASKS.md T-PROV-1:
      "for the 63 PARTIAL_REUSE forks, record a concrete reuse decision per
