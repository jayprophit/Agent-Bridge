name: ci
on: [push, pull_request]
jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "psutil==7.2.2"
      # Runs the suite the project itself declares in pyproject.toml
      # (tool.agent-bridge.test_command). It previously ran a hand-picked list
      # of 9 modules out of 112, so 103 modules - including every policy,
      # state-integrity, maintenance and capability test - were not gating
      # merges at all. Optional packages are imported defensively, so the
      # single pinned dependency is all the declared command needs.
      - run: python -m unittest discover -s tests -p "test_*.py"
