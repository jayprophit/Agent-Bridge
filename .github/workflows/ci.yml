name: ci

# The gate.
#
# It used to run the whole suite with `unittest discover`, which is the
# project's declared test command, and it was red: 26 failures and 28
# errors. The causes were not all the product's:
#
#   - Seven test modules import pytest, and the runner installed only
#     psutil, so those modules could not be imported at all.
#   - The mutation proof copies the repository twenty-three times and
#     runs the affected tests in each copy. It is legitimately slow, it
#     is marked `slow`, and the project documents a fast path that
#     deselects it. The runner was running it anyway, in a job with no
#     model runtime, so it could not have passed.
#   - The remaining failures are real findings, and they are not skipped
#     to make a build green. They are classified in
#     Aetherius-OS/docs/evidence/agent-bridge-ci-failure-classification.yaml
#     and they are the work.
#
# So the gate runs the fast path: the tests that need nothing external,
# at the speed a gate can be run on every push. The slow proof and the
# live-provider tests are separate jobs, because a test that needs a
# model runtime is not a test that can fail on a runner without one.

on: [push, pull_request]

jobs:
  fast:
    name: the fast gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The lockfile, not a set of ranges. The lock exists so that an
      # install reproduces the verification this tree was checked
      # against, rather than merely satisfying a range and getting
      # something else.
      - run: pip install -r requirements-lock.txt
      # The project's own documented fast path. The `slow` marker
      # deselects the mutation proof, which is a half-hour job and not
      # a gate.
      - run: python -m pytest tests -m "not slow" -q --no-header -p no:cacheprovider

  full:
    name: the full suite, including the slow proof
    # The slow proof copies the repository twenty-three times and runs
    # six test files in each copy, so it takes about forty minutes. It
    # is a gate for a release, not for every push.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest tests -q --no-header -p no:cacheprovider
